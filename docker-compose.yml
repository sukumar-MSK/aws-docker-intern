services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: login_app
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      DATABASE_URL: mysql+pymysql://appuser:${MYSQL_PASSWORD}@db:3306/login_app
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      RESET_TOKEN_DEBUG: ${RESET_TOKEN_DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mysql_data:
