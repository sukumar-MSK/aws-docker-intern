services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: login_app
      MYSQL_USER: appuser
      MYSQL_PASSWORD: local_dev_password_change_me
      MYSQL_ROOT_PASSWORD: local_root_password_change_me
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal_root_password_change_me"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      FLASK_ENV: production
      SECRET_KEY: local-only-change-this-secret
      JWT_SECRET_KEY: local-only-change-this-jwt-secret
      DATABASE_URL: mysql+pymysql://appuser:local_dev_password_change_me@db:3306/login_app
      CORS_ORIGINS: http://localhost:8081
      RESET_TOKEN_DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mysql_data:
